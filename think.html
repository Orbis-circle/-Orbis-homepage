<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ちょっとだけ考える</title>

    <style>
        body{
            font-family:sans-serif;
            background:#f7f7f7;
            margin:0;
            color:#333;
        }

        header{
            background:white;
            padding:80px 20px;
            text-align:center;
        }

        h1{
            font-size:48px;
        }

        .container{
            max-width:900px;
            margin:auto;
            padding:40px 20px;
        }

        .card{
            background:white;
            padding:30px;
            margin-bottom:20px;
            border-radius:12px;
        }

        a{
            color:#333;
        }
    </style>
</head>

<body>

<header>
    <h1>ちょっとだけ考える</h1>
    <p>
        日常のテーマを、少しだけ深く考えてみる交流イベント
    </p>
</header>

<div class="container">

    <div class="card">
        <h2>イベントについて</h2>

        <p>
            「猫はなぜ可愛いのか」
            「卒業式の日はなぜか、みんな優しいような気がする」
            「本気で遊ぶって？」
            など、
            日常にある”気になるところ”をテーマに、
            自由に考え、ゆるっと（ときに真剣に！）
          気軽に考えを共有する哲学カフェ風交流会です。
        </p>
    </div>

    <div class="card">
        <h2>対象</h2>

        <p>
            誰でも参加いただけます。
            論破よりも「互いの価値観を尊重する」ことを大切にしています。
        </p>
    </div>

    <div class="card">
        <h2>参加方法</h2>

        <p>
            InstagramのDMまたはGoogleフォームから応募していただけます。
        </p>
    </div>

    <div class="card">
        <a href="index.html">
            ← トップページに戻る
        </a>
    </div>

</div>

</body>
</html>
